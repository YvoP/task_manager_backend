services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    volumes:
      - ./:/var/www/html
   
   caddy:
    build:
      dockerfile: docker/Dockerfile
      target: caddy
    cap_add:
      - NET_ADMIN
    ports:
      - 8443:8443
    volumes:
      - ./:/var/www/html
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - php

  node:
    image: node:22
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: node-dev
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: sh -c "npm install && npm run watch"
    tty: true

volumes:
  mariadb:
  caddy_data:
  caddy_config:
