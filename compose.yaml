services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    environment:
      MERCURE_URL: ${MERCURE_URL}
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET}
    volumes:
      - ./:/var/www/html
    networks:
      - default
      - api-network

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    environment:
      MERCURE_URL: ${MERCURE_URL}
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET}
    volumes:
      - ./:/var/www/html
    command: php bin/console messenger:consume async scheduler_meetings_sync --time-limit=1800
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - default
      - api-network

  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_TRUSTED_ISSUERS: 'task-manager'
      MERCURE_PUBLISHER_JWT_KEY: '${MERCURE_JWT_SECRET}'
      MERCURE_SUBSCRIBER_JWT_KEY: '${MERCURE_JWT_SECRET}'
      MERCURE_EXTRA_DIRECTIVES: |
        resource_identifier https://localhost:8443/.well-known/mercure
        cors_origins https://localhost:8443
        anonymous
    volumes:
      - mercure_data:/data
      - mercure_config:/config

  caddy:
    build:
      dockerfile: docker/Dockerfile
      target: caddy
    cap_add:
      - NET_ADMIN
    ports:
      - "8443:8443"
      - "8444:8000"
    volumes:
      - ./:/var/www/html
      - caddy_back_data:/data
      - caddy_back_config:/config
    depends_on:
      - php
    networks:
      - api-network
      - default

  node:
    image: node:26
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: node-dev
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: sh -c "npm install && npm run watch"
    tty: true


  db:
    image: mariadb:10.11.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: db_taskmanager
    ports:
      - 3306:3306
    volumes:
      - mariadb:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - 8080:80
    depends_on:
      - db

volumes:
  mariadb:
  caddy_back_data:
  caddy_back_config:
  mercure_data:
  mercure_config:

networks:
  api-network:
    external: true
